name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Groovy 2.4 (the line Hubitat runs)
        run: tests/setup-tools.sh
      - name: Tests
        run: tests/run.sh
      - name: Hub test script against a fake hub and bridge
        run: tests/hub/selftest.sh
